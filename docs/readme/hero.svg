<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Pinpaper — Your Pinterest pictures, on your desktop.</title>
  <desc id="desc">A warm desktop wallpaper illustration for Pinpaper.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5ef"/>
      <stop offset="1" stop-color="#eef0e8"/>
