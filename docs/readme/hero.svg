  </defs>

  <rect width="1600" height="500" rx="28" fill="#f6f5ef"/>
  <path d="M0 415c164-65 294-43 443-5 157 40 287 45 437-3 170-54 322-70 486-10 84 31 159 35 234 16v87H0Z" fill="url(#ground)"/>
