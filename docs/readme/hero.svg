    <text x="-6" y="169" fill="#315d46" font-family="Georgia, 'Times New Roman', serif" font-size="132" letter-spacing="-7">pinpaper<tspan fill="#c7805a">.</tspan></text>
    <text x="3" y="238" fill="#315d46" font-family="Georgia, 'Times New Roman', serif" font-size="50">Your Pinterest pictures,</text>
    <text x="3" y="296" fill="#315d46" font-family="Georgia, 'Times New Roman', serif" font-size="50">on your desktop.</text>
    <path d="M5 335h565" stroke="#c9d8c9" stroke-width="3"/>
