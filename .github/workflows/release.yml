name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            os: macos-15
            arch: arm64
            bundles: dmg
          - platform: macOS-x64
            os: macos-15-intel
            arch: x64
            bundles: dmg
          - platform: Windows
            os: windows-latest
            arch: x64
            bundles: none
          - platform: Linux
            os: ubuntu-24.04
            arch: x64
            bundles: appimage,deb
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libfuse2t64

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build macOS DMG or Linux bundles
        if: runner.os != 'Windows'
        run: |
          npm run tauri -- build --bundles "${{ matrix.bundles }}"
          mkdir -p release-assets
          version=$(node -p "require('./package.json').version")
          if [ "${{ runner.os }}" = "macOS" ]; then
            bundle=$(find src-tauri/target/release/bundle -type f -name '*.dmg' -print -quit)
            test -n "$bundle"
            cp "$bundle" "release-assets/Pinpaper_${version}_macOS_${{ matrix.arch }}.dmg"
          else
            appimage=$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)
            deb=$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)
            test -n "$appimage"
            test -n "$deb"
            cp "$appimage" "release-assets/Pinpaper_${version}_linux_x64.AppImage"
            cp "$deb" "release-assets/Pinpaper_${version}_linux_x64.deb"
          fi

      - name: Verify macOS app inside final DMG
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
        run: |
          set -euo pipefail

          dmg=$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_dir=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          app="$mount_dir/Pinpaper.app"
          test -d "$app"

          version=$(node -p "require('./package.json').version")
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$bundle_version" = "$version"

          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          test -n "$executable"
          archs=$(lipo -archs "$executable")
          case " $archs " in
            *" $EXPECTED_ARCH "*) ;;
            *) echo "Unexpected executable architectures: $archs (expected $EXPECTED_ARCH)" >&2; exit 1 ;;
          esac

          # Validate the app copied into the DMG, including nested code and
          # every resource in its sealed CodeResources manifest.
          codesign --verify --deep --strict --verbose=2 "$app"
          signature_info=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature_info"
          printf '%s\n' "$signature_info" | grep -q '^Signature=adhoc$'
          test -f "$app/Contents/_CodeSignature/CodeResources"

          # Ad-hoc signatures are intentionally not treated as Apple trust.
          # spctl can reject them because this build is not Developer ID signed
          # or notarized; the strict codesign check above is the CI gate.
          if spctl_output=$(spctl -a -t exec -vv "$app" 2>&1); then
            echo "spctl accepted this app assessment:"
            printf '%s\n' "$spctl_output"
          else
            echo "::notice::spctl did not accept the ad-hoc/non-notarized app; this is expected and is not the CI acceptance gate."
            printf '%s\n' "$spctl_output"
          fi

      - name: Verify Linux bundles and packaged entrypoints
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          appimage=$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$appimage"
          test -n "$deb"

          # The outer AppImage launcher and the packaged application must both
          # be x86-64 ELF files; this is a structural check, not a desktop
          # session or GPU/NVIDIA runtime test.
          file "$appimage" | grep -Eq 'ELF 64-bit LSB.*x86-64'
          test "$(dpkg-deb --field "$deb" Architecture)" = amd64
          test "$(dpkg-deb --field "$deb" Version)" = "$version"

          deb_root=$(mktemp -d)
          appimage_root=$(mktemp -d)
          cleanup() {
            rm -rf "$deb_root" "$appimage_root"
          }
          trap cleanup EXIT

          dpkg-deb --extract "$deb" "$deb_root"
          deb_binary="$deb_root/usr/bin/pinpaper"
          test -x "$deb_binary"
          file "$deb_binary" | grep -Eq 'ELF 64-bit LSB.*x86-64'
          readelf -d "$deb_binary" | grep -q 'libwebkit2gtk-4.1.so.0'

          (cd "$appimage_root" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          appimage_binary="$appimage_root/squashfs-root/usr/bin/pinpaper"
          test -x "$appimage_binary"
          file "$appimage_binary" | grep -Eq 'ELF 64-bit LSB.*x86-64'
          readelf -d "$appimage_binary" | grep -q 'libwebkit2gtk-4.1.so.0'
          desktop_file=$(find "$appimage_root/squashfs-root" -maxdepth 2 -type f -name '*.desktop' -print -quit)
          test -n "$desktop_file"
          grep -Eq '^Exec=pinpaper([[:space:]]|$)' "$desktop_file"

      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri -- build --no-bundle
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = "src-tauri/target/release/pinpaper.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not produced at $exe" }
          Copy-Item $exe "release-assets/Pinpaper_${version}_x64-portable.exe"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pinpaper-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error

  publish:
    name: Prepare GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source for release notes
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Check release files and generate checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          sha256sum *.dmg *.exe *.AppImage *.deb > SHA256SUMS.txt

      - name: Verify versioned release notes
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Create release and attach bundles
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
